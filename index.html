<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puffer 质押 Mini App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>🐡 Puffer 质押 Mini App</h1>
    <p>基于 imToken Token Core • 兼容 tcx-wasm</p>
    
    <!-- 网络、连接、质押、DEX、UniFi 等保持之前版本不变 -->
    <div class="network-select">
      <label>网络：</label>
      <select id="network-select">
        <option value="mainnet" selected>Ethereum 主网</option>
        <option value="sepolia">Sepolia 测试网</option>
      </select>
    </div>
    
    <div id="connect-btn" class="btn">🔗 连接钱包 (imToken Token Core)</div>
    
    <!-- 其余内容与上一个版本完全一致（钱包信息、质押卡片、DEX、UniFi、安全提醒） -->
    <!-- ... （为了节省篇幅，这里省略，复制上一个版本的对应部分） ... -->
    
    <div class="safety">
      <strong>安全提醒：</strong><br>
      • 基于 imToken Token Core 开发<br>
      • 资产自托管 • 交易在 imToken 内确认<br>
      • 零基础 AI 共创作品
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
